<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MokAsas · Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Cairo',sans-serif;background-color:#050814;-webkit-user-select:none;user-select:none;}
  .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; margin-bottom: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .chat-me { background: linear-gradient(135deg, #00d9ff, #0066ff); color: white; align-self: flex-end; border-bottom-left-radius: 4px; }
  .chat-other { background: #0a1020; border: 1px solid #142038; color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
</style>
</head>
<body class="text-white h-screen flex flex-col overflow-hidden">

  <header class="bg-[#0a1020] border-b border-[#142038] p-4 flex items-center gap-4 shrink-0 shadow-lg z-10">
    <a href="app.html" class="text-[#00d9ff] text-2xl active:scale-90 transition">&rarr;</a>
    <div>
      <h2 class="font-bold text-lg leading-tight" id="target-name">...</h2>
      <p class="text-xs text-[#00ff9d]">متصل الآن</p>
    </div>
  </header>

  <main id="messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-1"></main>

  <footer class="bg-[#0a1020] border-t border-[#142038] p-3 shrink-0">
    <form id="chat-form" class="flex gap-2">
      <input type="text" id="msg-input" placeholder="اكتب رسالتك..." class="flex-1 bg-[#050814] border border-[#142038] rounded-full px-5 py-3 text-white focus:outline-none focus:border-[#00d9ff] transition text-sm" required autocomplete="off">
      <button type="submit" class="w-12 h-12 rounded-full bg-[#00d9ff] text-black flex items-center justify-center shadow-[0_0_15px_rgba(0,217,255,0.3)] active:scale-90 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" /></svg>
      </button>
    </form>
  </footer>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const serverUrl = localStorage.getItem('serverUrl');
  const token = localStorage.getItem('token');
  const myPhone = localStorage.getItem('phone');
  const targetPhone = new URLSearchParams(window.location.search).get('target');
  
  if (!token || !targetPhone) window.location.href = 'app.html';

  document.getElementById('target-name').textContent = targetPhone;

  // الاتصال بالسيرفر
  const socket = io(serverUrl, { auth: { token } });
  const form = document.getElementById('chat-form');
  const input = document.getElementById('msg-input');
  const messages = document.getElementById('messages');

  function appendMessage(isMe, text) {
    const div = document.createElement('div');
    div.classList.add('chat-bubble');
    div.classList.add(isMe ? 'chat-me' : 'chat-other');
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  socket.on('chat message', (data) => {
    if ((data.senderId === myPhone && data.targetId === targetPhone) || 
        (data.senderId === targetPhone && data.targetId === myPhone)) {
      appendMessage(data.senderId === myPhone, data.content);
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value) {
      socket.emit('chat message', { target: targetPhone, text: input.value });
      input.value = '';
    }
  });
</script>
</body>
</html>
