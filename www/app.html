<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MokAsas · Contacts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background-color:#050814;-webkit-user-select:none;user-select:none;}</style>
</head>
<body class="text-white h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-[#0a1020] border-b border-[#142038] p-4 flex justify-between items-center shrink-0 shadow-lg z-10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#00d9ff] to-[#0066ff] flex items-center justify-center text-xl shadow-[0_0_15px_rgba(0,217,255,0.4)]" id="avatar">👤</div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight" id="my-name">...</h1>
        <p class="text-xs text-[#00ff9d] font-mono" dir="ltr" id="my-phone">...</p>
      </div>
    </div>
    <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300 transition-colors px-2 py-1">خروج</button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4">
    <h2 class="text-[#6b7794] text-sm font-bold mb-4">جهات الاتصال على الشبكة</h2>
    <div id="contacts-list" class="space-y-3">
      <div class="animate-pulse flex items-center gap-4 bg-[#0a1020] p-4 rounded-2xl border border-[#142038]">
        <div class="w-12 h-12 rounded-full bg-[#142038]"></div>
        <div class="flex-1 space-y-2"><div class="h-4 bg-[#142038] rounded w-1/2"></div><div class="h-3 bg-[#142038] rounded w-1/3"></div></div>
      </div>
    </div>
  </main>

<script>
  const serverUrl = localStorage.getItem('serverUrl');
  const token = localStorage.getItem('token');
  const myPhone = localStorage.getItem('phone');
  
  if (!token || !serverUrl) window.location.href = 'index.html';

  document.getElementById('my-name').textContent = localStorage.getItem('name');
  document.getElementById('my-phone').textContent = myPhone;
  document.getElementById('avatar').textContent = localStorage.getItem('name').charAt(0);

  async function loadContacts() {
    try {
      const res = await fetch(`${serverUrl}/api/numbers/users`);
      const users = await res.json();
      const list = document.getElementById('contacts-list');
      
      const contacts = users.filter(u => u.phoneNumber !== myPhone);

      if (contacts.length === 0) {
        list.innerHTML = '<p class="text-center text-[#6b7794] mt-10">لا يوجد مستخدمون آخرون في الشبكة حالياً.</p>';
        return;
      }

      list.innerHTML = contacts.map(u => `
        <div class="bg-[#0a1020] border border-[#142038] rounded-2xl p-4 flex items-center justify-between shadow-lg hover:border-[#00d9ff]/50 transition">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-[#142038] border border-[#1e2942] flex items-center justify-center text-xl text-[#00d9ff] font-bold">
              ${u.username.charAt(0)}
            </div>
            <div>
              <h3 class="font-bold text-white">${u.username}</h3>
              <p class="text-xs text-[#6b7794] font-mono mt-1" dir="ltr">${u.phoneNumber}</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="startChat('${u.phoneNumber}')" class="w-11 h-11 rounded-full bg-[#00d9ff]/10 text-[#00d9ff] flex items-center justify-center active:scale-90 transition">💬</button>
            <button onclick="startCall('${u.phoneNumber}')" class="w-11 h-11 rounded-full bg-[#00ff9d]/10 text-[#00ff9d] flex items-center justify-center active:scale-90 transition">📞</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      console.error(err);
      document.getElementById('contacts-list').innerHTML = '<p class="text-center text-red-400 mt-10">فشل الاتصال بالسيرفر</p>';
    }
  }

  function startChat(phone) { window.location.href = `chat.html?target=${phone}`; }
  function startCall(phone) { window.location.href = `call.html?target=${phone}`; }
  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  loadContacts();
</script>
</body>
</html>
